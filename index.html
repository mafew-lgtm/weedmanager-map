<!DOCTYPE html>
<html>
<head>
    <title>WeedManager Combined Web Map</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #map { width: 100vw; height: 100vh; }
        .map-title {
            position: absolute; top: 10px; left: 50px; z-index: 1000;
            background: rgba(255, 255, 255, 0.9); padding: 8px 15px;
            border-radius: 5px; box-shadow: 0 0 10px rgba(0,0,0,0.2);
            margin: 0; font-size: 16px; font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="map-title">WeedManager - Unified Projects Map</div>
    <div id="map"></div>
    <script>
        var map = L.map('map').setView([-35.0149322397, 173.467512], 12);
        var carto = L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap &copy; CARTO' }).addTo(map);
        var esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: 'Tiles &copy; Esri' });
        
        var baseMaps = { "Streets (CartoDB)": carto, "Satellite (Esri)": esriSat };
        var overlayMaps = {};
        var speciesPoints = {};

        var layersToFetch = [
            { file: 'data_points.geojson', title: 'Points', color: '#e31a1c', isWeed: true }, { file: 'data_polygons.geojson', title: 'Polygons', color: '#33a02c', isWeed: true }, { file: 'data_linestrings.geojson', title: 'Linestrings', color: '#ff7f00', isWeed: true }, { file: 'data_tracks.geojson', title: 'Tracks', color: '#1f78b4', isWeed: false }, { file: 'data_work_areas.geojson', title: 'Work-areas', color: '#6a3d9a', isWeed: false }
        ];

        var layerControl = L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

        // Dynamic async fetch per layer
        var fetchPromises = layersToFetch.map(function(cfg) {
            return fetch(cfg.file)
                .then(function(res) { return res.json(); })
                .then(function(geoJson) {
                    var layer = L.geoJson(geoJson, {
                        style: function(feature) {
                            return { color: cfg.color, weight: 3, opacity: 0.8, fillColor: cfg.color, fillOpacity: 0.35 };
                        },
                        pointToLayer: function(feature, latlng) {
                            return L.circleMarker(latlng, { radius: 6, fillColor: cfg.color, color: "#000", weight: 1, opacity: 1, fillOpacity: 0.8 });
                        },
                        onEachFeature: function(feature, layer) {
                            var popupContent = '<div style="max-height: 200px; overflow-y: auto;"><b>' + cfg.title + '</b><hr>';
                            if (feature.properties) {
                                for (var key in feature.properties) {
                                    popupContent += '<b>' + key + ':</b> ' + feature.properties[key] + '<br>';
                                }
                            }
                            popupContent += '</div>';
                            layer.bindPopup(popupContent);
                        }
                    }).addTo(map);

                    layerControl.addOverlay(layer, cfg.title);

                    // Collect heatmaps for weed features
                    if (cfg.isWeed && geoJson.features) {
                        geoJson.features.forEach(function(feature) {
                            if (!feature.properties) return;
                            var species = feature.properties.species || 
                                          feature.properties.species_name || 
                                          feature.properties.weed_type || 
                                          feature.properties.name || 
                                          "Unspecified Species";
                            
                            if (!speciesPoints[species]) speciesPoints[species] = [];

                            function addCoords(coords) {
                                if (typeof coords[0] === 'number') {
                                    speciesPoints[species].push([coords[1], coords[0]]);
                                } else if (Array.isArray(coords)) {
                                    coords.forEach(addCoords);
                                }
                            }

                            if (feature.geometry && feature.geometry.coordinates) {
                                addCoords(feature.geometry.coordinates);
                            }
                        });
                    }
                })
                .catch(function(err) {
                    console.error('Error loading ' + cfg.file, err);
                });
        });

        // Generate species heatmaps once all files have loaded
        Promise.all(fetchPromises).then(function() {
            Object.keys(speciesPoints).forEach(function(species) {
                var pts = speciesPoints[species];
                if (pts.length > 0) {
                    var heatLayer = L.heatLayer(pts, { radius: 20, blur: 15, maxZoom: 17 });
                    layerControl.addOverlay(heatLayer, "Heatmap: " + species);
                }
            });
        });
    </script>
</body>
</html>
